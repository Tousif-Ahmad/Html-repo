<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form in html</title>
</head>
<body>
    <h1>Forms in html</h1>
    <form action="">
        <label for="name">Name</label>
        <input id="name" type="text" placeholder="enter your name"> <br> <br>
        <label for="age">Age</label>
        <input id="age" type="number" placeholder="enter your age"> <br> <br>

        <label for="address">Address</label> <br>
        <textarea name="" id="address" cols="20" rows="8" placeholder="enter your address"></textarea> <br>

        <label for="Cars">Choose a Car</label> <br>
        <select name="" id="Cars">
            <option value="bmw">BMW</option>
            <option selected value="audi">AUDI</option>
            <option value="mercedes">Mercedes</option>
        </select>
        <br> <br>

        <fieldset>
            <legend>Form</legend>
            <input type="text" placeholder="first Name">
            <input type="text" placeholder="middle Name">
            <input type="text" placeholder="Last Name">
        </fieldset>
        <br> <br>

        <label for="browsers">Your Favorite Browser</label> <br>
        <input List="browsers">
        <datalist id="browsers">
            <option value="Edge"></option>
            <option value="Chrome"></option>
            <option value="FireFox"></option>
            <option value="Brave"></option>
        </datalist>
    </form>
</body>
</html>
